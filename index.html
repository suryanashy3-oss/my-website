<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Suryansh Yadav | Casting Director, Editor & Actor | Square4u">
  <title>Suryansh Yadav | Square4u</title>

  <style>
    :root {
      --bg: #060606;
      --bg-soft: #0c0c0c;
      --text: #f7f7f7;
      --muted: #a6a6a6;
      --gold: #ffc107;
      --gold-2: #ffcf3f;
      --line: rgba(255,255,255,.10);
      --glass: rgba(255,255,255,.055);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(255,193,7,.10), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(255,193,7,.06), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      width: min(1280px, 100%);
      margin: auto;
      padding: 24px 34px 28px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
      animation: headerIn .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
    }

    .brand-logo {
      width: 62px;
      height: 40px;
      object-fit: contain;
      object-position: center;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .availability {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cfcfcf;
      font-size: .78rem;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .availability i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
      animation: pulse 1.8s ease-in-out infinite;
    }

    /* ---------- Hero ---------- */
    .hero {
      flex: 1;
      min-height: calc(100vh - 130px);
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      align-items: center;
      position: relative;
    }

    .copy {
      position: relative;
      z-index: 3;
      padding-bottom: 50px;
      animation: copyIn 1s .35s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      color: var(--gold);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      max-width: 520px;
      font-size: clamp(3.2rem, 6.1vw, 6.4rem);
      line-height: .92;
      letter-spacing: -.065em;
      font-weight: 850;
    }

    h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,.55);
    }

    .role {
      margin-top: 25px;
      color: #ddd;
      font-size: clamp(1rem, 1.6vw, 1.22rem);
      line-height: 1.6;
      max-width: 430px;
    }

    .role strong { color: #fff; }

    .channel {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-top: 26px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      color: #eee;
      transition: .3s ease;
    }

    .channel:hover {
      transform: translateY(-3px);
      border-color: rgba(255,193,7,.45);
      box-shadow: 0 12px 40px rgba(255,193,7,.08);
    }

    .youtube-dot {
      width: 28px;
      height: 20px;
      border-radius: 7px;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .youtube-dot::after {
      content: "";
      border-left: 7px solid #090909;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      margin-left: 2px;
    }

    .channel small {
      color: #929292;
      font-size: .67rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .channel b { font-size: .92rem; }

    /* ---------- Portrait ---------- */
    .portrait-wrap {
      align-self: end;
      justify-self: center;
      width: min(100%, 620px);
      height: min(84vh, 820px);
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: portraitIn 1.35s .15s cubic-bezier(.16,1,.3,1) both;
    }

    .portrait-wrap::before {
      content: "";
      position: absolute;
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,193,7,.13);
      filter: blur(80px);
      bottom: 15%;
      z-index: -1;
      animation: glow 4s ease-in-out infinite;
    }

    .portrait {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 25px 35px rgba(0,0,0,.45));
      transform-origin: center bottom;
      animation: float 6s 1.5s ease-in-out infinite;
    }

    /* ---------- Right details ---------- */
    .details {
      justify-self: end;
      align-self: center;
      padding-bottom: 40px;
      text-align: right;
      animation: detailsIn 1s .55s cubic-bezier(.2,.8,.2,1) both;
      z-index: 3;
    }

    .detail-number {
      color: var(--gold);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .detail-title {
      color: #eee;
      font-size: 1rem;
      line-height: 1.55;
      max-width: 210px;
    }

    .line {
      width: 70px;
      height: 1px;
      background: var(--gold);
      margin: 23px 0 23px auto;
      opacity: .8;
    }

    .location {
      color: #888;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ---------- Bottom actions ---------- */
    .actions {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      animation: actionsIn 1s .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .action {
      min-width: 170px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(15px);
      color: #f3f3f3;
      font-size: .88rem;
      font-weight: 700;
      transition: transform .28s ease, background .28s ease, border-color .28s ease, box-shadow .28s ease;
    }

    .action svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .action:hover {
      transform: translateY(-5px);
      background: rgba(255,193,7,.12);
      border-color: rgba(255,193,7,.45);
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    .action.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #111;
    }

    .action.primary:hover {
      background: var(--gold-2);
      box-shadow: 0 14px 42px rgba(255,193,7,.20);
    }

    /* ---------- Animations ---------- */
    @keyframes headerIn {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes copyIn {
      from { opacity: 0; transform: translateX(-45px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes detailsIn {
      from { opacity: 0; transform: translateX(35px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes portraitIn {
      from { opacity: 0; transform: translateY(100px) scale(.94); filter: blur(10px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes actionsIn {
      from { opacity: 0; transform: translateY(35px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .5; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes glow {
      0%, 100% { opacity: .65; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1000px) {
      .page { padding: 20px 22px 24px; }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 35px;
      }

      .copy {
        text-align: center;
        padding-bottom: 0;
        order: 1;
      }

      h1 { margin: auto; }

      .role { margin-left: auto; margin-right: auto; }

      .portrait-wrap {
        order: 2;
        width: min(100%, 580px);
        height: min(70vh, 670px);
        margin-top: -8px;
      }

      .details { display: none; }

      .actions {
        order: 3;
        margin-top: -20px;
      }
    }

    @media (max-width: 560px) {
      .page { padding: 18px 15px 20px; }

      .brand-logo { width: 53px; height: 34px; }
      .brand-name { font-size: .78rem; }
      .availability { display: none; }

      .hero { padding-top: 28px; }

      .eyebrow { font-size: .64rem; margin-bottom: 13px; }

      h1 {
        font-size: clamp(3rem, 16vw, 4.8rem);
        line-height: .9;
      }

      .role {
        font-size: .95rem;
        margin-top: 18px;
      }

      .channel {
        margin-top: 19px;
        padding: 9px 13px;
      }

      .portrait-wrap {
        height: 57vh;
        min-height: 420px;
        margin-top: 5px;
      }

      .actions {
        width: 100%;
        gap: 8px;
        margin-top: -4px;
      }

      .action {
        flex: 1;
        min-width: 0;
        padding: 12px 8px;
        font-size: .78rem;
        border-radius: 11px;
      }
    }
  </style>
</head>
